# Protected-main build, publish, and release-metadata workflow.
#
# What this workflow DOES today:
#   * re-runs the full CI check set against the exact protected-main commit;
#   * RENDERS the deployment placeholders from the one committed source of truth
#     (release/contract.json) and refuses to go further while they are unallocated;
#   * builds the image from Containerfile.release on GitHub-hosted infrastructure;
#   * pushes it to ghcr.io/dmedellin/learn-geterdone by immutable digest;
#   * emits the immutable release contract a deploy would consume, VALIDATES it
#     against release/contract.schema.json, and uploads it with the release
#     metadata (image digest, git revision, release-contract sha256, release id,
#     invocation identity) as a
#     non-secret build artifact.
#
# WHY THIS MATCHES PRODUCTION:
#   The host is already onboarded for the shared-private-edge model. The image
#   listens on 8080, and the root-owned wrapper attaches it to
#   platform-private-edge at 10.89.2.22 before host Caddy cuts over traffic.
#   No loopback port, private subnet, or repository Compose file is allocated or
#   consumed by this workflow. The render step substitutes only the revision
#   label and rejects obsolete deployment placeholders; metadata makes the
#   deployable output depend on the final contract placeholder scan.
#
# This workflow builds, publishes, records immutable release metadata, and then
# deploys through the already-installed host wrapper after environment approval.
#
# Secrets: none beyond the automatic GITHUB_TOKEN. Do not add any.
#
# Action pinning: the platform contract prefers commit-pinned third-party
# actions. These tags mirror dmedellin/pixelbattle-landing because no commit SHA
# could be verified offline. Replace each tag with a verified 40-hex commit SHA
# before onboarding; never guess one.

name: Release

on:
  push:
    branches: [main]

# One queue per app. Later releases wait; they never cancel an in-flight one
# (docs/DEPLOYMENT_CONTRACT.md section 7).
concurrency:
  group: production-learn-geterdone
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_SLUG: learn-geterdone
  IMAGE_REPOSITORY: ghcr.io/dmedellin/learn-geterdone
  # The single declared source of truth for every render-time value. Nothing in
  # this workflow may take a port, a subnet, or a frozen contract field from
  # anywhere else - not from an input, not from a variable, not from a default.
  CONTRACT_SOURCE: release/contract.json

defaults:
  run:
    shell: bash

jobs:
  # The same checks a pull request must pass, re-run against the merged commit.
  # This is also what proves, for the exact commit being released, that nobody
  # quietly allocated a port or subnet and that no CIDR overlaps a reserved one
  # ("Unallocated resources stay unallocated" in ci.yml). The render step below
  # therefore checks allocation STATE, not allocation LEGALITY; the two live in
  # one place each.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-publish:
    name: Build and publish by digest
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_reference: ${{ steps.metadata.outputs.image_reference }}
      revision: ${{ steps.metadata.outputs.revision }}
      release_id: ${{ steps.metadata.outputs.release_id }}
      contract_sha256: ${{ steps.metadata.outputs.contract_sha256 }}
      deployable: ${{ steps.metadata.outputs.deployable }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Exact commit, never a moving ref.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert repository identity
        run: |
          set -euo pipefail
          # The registry maps one source repository to one OCI repository. A
          # fork or a rename must not publish into this app's namespace.
          expected="ghcr.io/${GITHUB_REPOSITORY}"
          if [ "$expected" != "$IMAGE_REPOSITORY" ]; then
            echo "::error::Repository identity mismatch: $expected != $IMAGE_REPOSITORY"
            exit 1
          fi
          echo "Publishing as $IMAGE_REPOSITORY"

      # =================================================================
      # RENDER. The shared-edge deployment values are committed policy and are
      # already allocated by platform onboarding. Only the image revision label
      # is rendered here; obsolete loopback/subnet tokens are rejected rather
      # than silently carried into a release.
      # =================================================================
      - name: Render deployment placeholders
        id: render
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          python3 - <<'PY'
          import os, pathlib, re, sys
          PLACEHOLDER = re.compile(r"__[A-Z][A-Z0-9_]*__")
          revision = os.environ["GITHUB_SHA"].strip()
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              print("::error::Source revision is not 40 lowercase hex: %r" % revision)
              sys.exit(1)
          for path in (pathlib.Path("Containerfile.release"), pathlib.Path("deploy/Caddyfile")):
              text = path.read_text(encoding="utf-8")
              if "__LOOPBACK_PORT__" in text or "__APP_SUBNET__" in text:
                  print("::error::%s still contains an obsolete loopback/subnet placeholder" % path)
                  sys.exit(1)
              if path.name == "Containerfile.release":
                  text = text.replace("__GIT_REVISION__", revision)
                  path.write_text(text, encoding="utf-8")
              residual = [found for found in PLACEHOLDER.findall(text)
                          if found != "__GIT_REVISION__"]
              if residual:
                  print("::error::%s has unrendered placeholders: %s" % (path, ", ".join(residual)))
                  sys.exit(1)
          epoch = os.environ.get("SOURCE_DATE_EPOCH", "").strip()
          if not epoch.isdigit() or int(epoch) < 1700000000:
              print("::error::Could not determine a usable SOURCE_DATE_EPOCH: %r" % epoch)
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("source_date_epoch=%s\n" % epoch)
          PY

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          # Immutable, commit-addressed tag only. No `latest`, no moving
          # deployment tag: the digest is the only deployable identity.
          tags: type=sha,format=long
          labels: |
            org.opencontainers.image.title=Learn - geterdone.io
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: build
        uses: docker/build-push-action@v7
        env:
          # buildx honours SOURCE_DATE_EPOCH for image timestamps. It makes the
          # build a function of the commit rather than of the clock; whether two
          # runs actually produce the identical digest is NOT asserted here, so
          # the contract's build.reproducible stays false until someone proves it.
          SOURCE_DATE_EPOCH: ${{ steps.render.outputs.source_date_epoch }}
        with:
          # The rendered working tree, not the committed bytes: see the render
          # step. Containerfile.release still runs `caddy validate` on the
          # rendered deploy/Caddyfile, so an unrendered config cannot ship.
          context: .
          file: ./Containerfile.release
          build-args: RELEASE_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =================================================================
      # The release contract is COMMITTED (release/contract.json) and COMPLETED
      # here. Reviewed policy - identity, domains, runtime controls, health,
      # acceptance matrix, evidence destinations, network - is committed, because
      # it is exactly the sort of thing that must be reviewed in a pull request
      # and must not be synthesized differently on every run. Everything a run
      # can PROVE - source revision/ref, registry-returned digest, release id,
      # build clock, base image digests, template and rendered-Compose hashes,
      # invocation identity, placeholder state - is filled in from run facts,
      # because committing those would mean committing a claim no commit can back.
      # =================================================================
      - name: Emit immutable release metadata
        id: metadata
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_DATE_EPOCH: ${{ steps.render.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, sys

          # Canonical serialization for anything that gets hashed:
          #   UTF-8, sorted keys, compact separators, single trailing newline.
          # The deploy wrapper's --contract-sha256 is the sha256 of exactly the
          # bytes written to release-contract.json below.
          def canonical(document):
              return (json.dumps(document, sort_keys=True, separators=(",", ":"),
                                 ensure_ascii=False) + "\n").encode("utf-8")

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def die(*lines):
              for line in lines:
                  print("::error::%s" % line)
              sys.exit(1)

          PLACEHOLDER = re.compile(r"^__[A-Z][A-Z0-9_]*__$")
          ZERO_DIGEST = "sha256:" + "0" * 64
          ZERO_REVISION = "0" * 40

          # 1. The committed contract source. An example or a schema is never a
          #    release; the example is explicitly refused.
          source_path = pathlib.Path(os.environ["CONTRACT_SOURCE"])
          if not source_path.is_file():
              die("No committed release contract at %s." % source_path,
                  "release/contract.example.json is a shape reference and must never be staged as a release.")
          contract = json.loads(source_path.read_text(encoding="utf-8"))

          # Shared-private-edge values are reviewed policy in the committed
          # contract and are consumed by the host wrapper, not rendered here.

          # 2. Facts this run can prove.
          digest = os.environ["IMAGE_DIGEST"].strip()
          revision = os.environ["GITHUB_SHA"].strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          image_repository = os.environ["IMAGE_REPOSITORY"]
          fail = []
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest) or digest == ZERO_DIGEST:
              fail.append("registry digest is not a real canonical sha256: %r" % digest)
          if not re.fullmatch(r"[0-9a-f]{40}", revision) or revision == ZERO_REVISION:
              fail.append("source revision is not a real 40-lowercase-hex commit: %r" % revision)
          declared = contract.get("image", {}).get("repository")
          if declared and declared != image_repository:
              fail.append("contract image.repository %r != %r" % (declared, image_repository))
          if fail:
              die(*fail)

          contract["source"] = {
              "repository": repository,
              "revision": revision,
              "ref": os.environ["GITHUB_REF"],
          }
          contract["image"] = {
              "repository": image_repository,
              "digest": digest,
              "reference": "%s@%s" % (image_repository, digest),
          }
          contract["release_id"] = "%s-%s" % (revision, digest.split(":")[1][:12])

          # 3. Build facts, including the base images this run actually built
          #    FROM. Containerfile.release is the only place a base image is
          #    pinned, so the digests are read back out of it and cannot drift
          #    from what was built.
          containerfile = pathlib.Path("Containerfile.release")
          base_images, seen = [], set()
          for line in containerfile.read_text(encoding="utf-8").splitlines():
              match = re.match(r"\s*FROM\s+(\S+)", line, re.I)
              if not match or line.lstrip().startswith("#"):
                  continue
              reference, _, image_digest = match.group(1).partition("@")
              if "/" in reference and ":" in reference.rsplit("/", 1)[1]:
                  reference = reference.rsplit(":", 1)[0]   # a tag is never an identity
              base_images.append({"reference": reference,
                                  "digest": image_digest or "__BASE_IMAGE_DIGEST__"})
          if not base_images:
              die("No FROM instruction found in %s." % containerfile)
          for index, entry in enumerate(base_images):
              entry["role"] = "runtime" if index == len(base_images) - 1 else "build"
          deduplicated = []
          for entry in base_images:
              key = (entry["role"], entry["reference"], entry["digest"])
              if key not in seen:
                  seen.add(key)
                  deduplicated.append({"role": entry["role"], "reference": entry["reference"],
                                       "digest": entry["digest"]})
          # The build clock is the commit's, not the wall clock: two attempts of the
          # same revision must produce the same bytes here. `workflow_run_attempt`
          # distinguishes executions; it must not manufacture new release content
          # (IMMUTABLE_RELEASE_AND_ACTIVATION.md section 2.1).
          source_date_epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          contract["build"] = {
              "timestamp": (datetime.datetime.fromtimestamp(source_date_epoch,
                                                            datetime.timezone.utc)
                            .replace(microsecond=0).isoformat().replace("+00:00", "Z")),
              "source_date_epoch": source_date_epoch,
              "base_images": deduplicated,
              # True only when the same revision and clock were built twice and
              # produced the identical digest. This workflow builds once.
              "reproducible": False,
          }

          # 4. Invocation identity: delivery/audit identity, never release content
          #    identity (IMMUTABLE_RELEASE_AND_ACTIVATION.md section 2.1). The
          #    environment is the production environment this release is destined
          #    for and is the only one the deploy job may ever run in.
          contract["invocation"] = {
              "repository": repository,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "environment": "production",
          }

          contract["notes"] = [
              "Emitted by .github/workflows/release.yml from the committed source %s at run %s attempt %s."
              % (source_path, os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]),
              "Proven by this run: source, image, release_id, build, invocation and placeholder state. "
              "Shared-private-edge network policy and acceptance checks are reviewed and committed.",
              "The host is onboarded: platform-private-edge, fixed address 10.89.2.22, the self-hosted runner, "
              "production environment approval, and platform-deploy-static are already in place.",
          ]

          # 6. Unresolved placeholders block deployment, and the contract has to
          #    say WHERE they are: `unallocated` is a list of JSON Pointers, and
          #    the schema requires it exactly when placeholders_present is true.
          def placeholder_pointers(node, pointer=""):
              found = []
              if isinstance(node, dict):
                  for key, child in node.items():
                      if key in ("notes", "unallocated"):
                          continue
                      found.extend(placeholder_pointers(child, "%s/%s" % (pointer, key)))
              elif isinstance(node, list):
                  for index, child in enumerate(node):
                      found.extend(placeholder_pointers(child, "%s/%d" % (pointer, index)))
              elif isinstance(node, str) and PLACEHOLDER.match(node):
                  found.append(pointer)
              return found

          placeholders = sorted(set(placeholder_pointers(contract)))
          contract["placeholders_present"] = bool(placeholders)
          if placeholders:
              contract["unallocated"] = placeholders
          else:
              contract.pop("unallocated", None)
          deployable = not placeholders

          payload = canonical(contract)
          out = pathlib.Path("release-artifacts")
          out.mkdir(exist_ok=True)
          (out / "release-contract.json").write_bytes(payload)
          contract_sha256 = sha256_bytes(payload)

          metadata = {
              "schema_version": 1,
              "application": {"slug": os.environ["APP_SLUG"]},
              "source": contract["source"],
              "image": contract["image"],
              "release_id": contract["release_id"],
              "release_contract_sha256": contract_sha256,
              "invocation": dict(contract["invocation"],
                                 run_url="%s/%s/actions/runs/%s" % (os.environ["GITHUB_SERVER_URL"],
                                                                    repository,
                                                                    os.environ["GITHUB_RUN_ID"])),
              "deployable": deployable,
              "unresolved_placeholders": placeholders,
              "deploy_blockers": (["Unresolved placeholders: %s" % ", ".join(placeholders)]
                                  if placeholders else []),
          }
          (out / "release-metadata.json").write_bytes(canonical(metadata))

          checksums = []
          for name in sorted(p.name for p in out.iterdir()):
              checksums.append("%s  %s" % (sha256_bytes((out / name).read_bytes()), name))
          (out / "checksums.sha256").write_text("\n".join(checksums) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("revision=%s\n" % revision)
              handle.write("image_reference=%s\n" % contract["image"]["reference"])
              handle.write("release_id=%s\n" % contract["release_id"])
              handle.write("contract_sha256=%s\n" % contract_sha256)
              handle.write("deployable=%s\n" % ("true" if deployable else "false"))

          summary = [
              "### Release metadata", "",
              "| field | value |", "| --- | --- |",
              "| image | `%s` |" % contract["image"]["reference"],
              "| revision | `%s` |" % revision,
              "| release id | `%s` |" % contract["release_id"],
              "| release-contract sha256 | `%s` |" % contract_sha256,
              "| deployable | **%s** |" % ("yes" if deployable else "no"),
              "",
              "Published by digest. Deployment uses the onboarded shared-private-edge wrapper.",
          ]
          if placeholders:
              summary.append("")
              summary.append("Unresolved placeholders requiring human allocation: `%s`"
                             % "`, `".join(placeholders))
              print("::warning::Release contract still contains placeholders (%s). "
                    "Deployment is blocked until a human allocates them."
                    % ", ".join(placeholders))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          PY

      # The emitted contract is what a deploy would consume, so it must be
      # provably well-formed before anyone can consume it. The previous version
      # of this workflow emitted a document that could never validate (a
      # top-level `workflow` key against additionalProperties:false, and no
      # `invocation` object at all) precisely because nothing ever checked.
      - name: Validate the emitted release contract against its schema
        run: |
          set -euo pipefail
          python3 scripts/validate_release_contract.py \
            --schema release/contract.schema.json \
            --github \
            release-artifacts/release-contract.json

      # Upload whenever the metadata step produced artifacts, including when the
      # schema validation above rejected them - the invalid document is exactly
      # what someone needs to look at. Not when the render gate stopped the run
      # first: there is nothing to upload then, and a second red step would only
      # bury the allocation message.
      - name: Upload release metadata
        if: always() && steps.metadata.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: release-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90

  # ===================================================================
  # deploy-production — enabled for the already-onboarded shared-private-edge
  # platform model. The release still requires all of the following:
  #
  #   * the protected-main CI and build-and-publish jobs;
  #   * a digest-pinned GHCR image and a contract with no placeholders;
  #   * the self-hosted runner labels below and the protected production
  #     environment approval;
  #   * the root-owned /usr/local/sbin/platform-deploy-static wrapper and its
  #     wrapper-only sudoers rule; and
  #   * the host-owned shared-private-edge network/Caddy configuration.
  #
  # These platform prerequisites are now in place for learn-geterdone. The
  # wrapper renders its own Compose file, attaches 10.89.2.22:8080 to
  # platform-private-edge, probes /release.txt and the public routes, and rolls
  # back on failure. The GHCR token goes over stdin, never argv or a log line.
  # ===================================================================
  deploy-production:
    name: Deploy to production (shared-private-edge)
    needs: build-and-publish
    runs-on: [self-hosted, linux, x64, hetzner-prod, learn-geterdone]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Refuse a release contract that still holds placeholders
        run: |
          set -euo pipefail
          if [ "${{ needs.build-and-publish.outputs.deployable }}" != "true" ]; then
            echo "::error::Release contract has unresolved placeholders; a human must allocate them first."
            exit 1
          fi

      - name: Deploy through the root-owned platform boundary
        id: deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ needs.build-and-publish.outputs.image_reference }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p deploy-evidence
          # The wrapper's own stdout/stderr is the runner-side transcript. It is
          # captured rather than streamed so that it is redacted BEFORE it is
          # persisted or uploaded (docs/DEPLOYMENT_CONTRACT.md section 11:
          # "Redaction happens before persistent write and artifact upload").
          # The authoritative record is the root-owned redacted transcript and
          # result.json the wrapper writes under
          # /var/log/app-platform/learn-geterdone/<UTC-date>/, which this
          # unprivileged runner account cannot read; the copy uploaded below is
          # correlated to it by run id, attempt, digest and contract hash, and
          # is explicitly not the sole evidence store.
          status=0
          printf '%s\n' "$GHCR_TOKEN" | sudo -n /usr/local/sbin/platform-deploy-static \
            "$APP_SLUG" "$APP_IMAGE" "$GITHUB_SHA" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > deploy-evidence/transcript.raw 2>&1 || status=$?
          echo "wrapper_exit_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Redact and hash the deployment transcript
        if: always()
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRAPPER_EXIT_STATUS: ${{ steps.deploy.outputs.wrapper_exit_status }}
          IMAGE_REFERENCE: ${{ needs.build-and-publish.outputs.image_reference }}
          REVISION: ${{ needs.build-and-publish.outputs.revision }}
          RELEASE_ID: ${{ needs.build-and-publish.outputs.release_id }}
          CONTRACT_SHA256: ${{ needs.build-and-publish.outputs.contract_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re

          out = pathlib.Path("deploy-evidence")
          out.mkdir(exist_ok=True)
          raw = out / "transcript.raw"
          text = raw.read_text(encoding="utf-8", errors="replace") if raw.is_file() else \
              "(the deploy step produced no transcript; it did not start or was cancelled)\n"

          REDACTED = "***REDACTED***"
          # 1. The exact secret material this job holds, longest first.
          literals = sorted((value for value in (os.environ.get("GHCR_TOKEN"),) if value),
                            key=len, reverse=True)
          # 2. Anything else shaped like a credential, because a transcript may
          #    quote material this job never had.
          patterns = [
              re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"(?i)\b(authorization|proxy-authorization)\s*:\s*\S+(\s+\S+)?"),
              re.compile(r"(?i)\b(bearer|basic)\s+[A-Za-z0-9+/=._-]{8,}"),
              re.compile(r"(?i)--(password|token|secret|authfile)(=|\s+)\S+"),
              re.compile(r"(?i)\b(password|passwd|secret|api[_-]?key|access[_-]?token|"
                         r"registry[_-]?token)\s*[:=]\s*\S+"),
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----"),
          ]
          lines = []
          for line in text.splitlines():
              for literal in literals:
                  line = line.replace(literal, REDACTED)
              for pattern in patterns:
                  line = pattern.sub(REDACTED, line)
              lines.append(line)
          transcript = ("\n".join(lines) + "\n").encode("utf-8")

          (out / "transcript.log").write_bytes(transcript)
          digest = hashlib.sha256(transcript).hexdigest()
          (out / "transcript.log.sha256").write_text("%s  transcript.log\n" % digest, encoding="utf-8")
          if raw.is_file():
              raw.unlink()   # the unredacted capture never leaves this step

          status = os.environ.get("WRAPPER_EXIT_STATUS", "")
          (out / "invocation.json").write_text(json.dumps({
              "schema_version": 1,
              "slug": os.environ["APP_SLUG"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "environment": "production",
              "runner_labels": ["self-hosted", "linux", "x64", "hetzner-prod",
                                os.environ["APP_SLUG"]],
              "image_reference": os.environ.get("IMAGE_REFERENCE", ""),
              "source_revision": os.environ.get("REVISION", ""),
              "release_id": os.environ.get("RELEASE_ID", ""),
              "release_contract_sha256": os.environ.get("CONTRACT_SHA256", ""),
              "wrapper_exit_status": int(status) if status.isdigit() else None,
              "transcript_sha256": digest,
              "note": ("Runner-side correlation record and redacted transcript copy only. The "
                       "authoritative append-only audit record is root-owned under "
                       "/var/log/app-platform/<slug>/<UTC-date>/ and is not readable by this "
                       "runner account. This file asserts no acceptance outcome."),
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload redacted deployment transcript
        if: always()
        uses: actions/upload-artifact@v5
        with:
          # evidence.artifact_name in the release contract is the stable prefix;
          # run id and attempt keep re-runs from colliding.
          name: learn-geterdone-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          # An explicit allowlist, never the whole directory: the unredacted
          # capture must not be uploadable even if the redaction step fails.
          path: |
            deploy-evidence/transcript.log
            deploy-evidence/transcript.log.sha256
            deploy-evidence/invocation.json
          if-no-files-found: error
          retention-days: 90
